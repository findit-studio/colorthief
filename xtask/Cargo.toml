[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.95.0"

[dependencies]
csv          = "1"
serde        = { version = "1", features = ["derive"] }
proc-macro2  = "1"
quote        = "1"
syn          = "2"
prettyplease = "0.2"
heck         = "0.5"
# Use the same libm the dataset crate uses for runtime LAB conversion, so
# pre-computed and runtime-computed LAB values agree bit-for-bit.
libm         = { version = "0.2", default-features = false }

[lints]
workspace = true
