[workspace]
members = [
  "colorthief",
]
default-members = [
  "colorthief",
]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/findit-ai/colorthief"
homepage = "https://github.com/findit-ai/colorthief"

[workspace.dependencies]
thiserror = { version = "2", default-features = false }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false
