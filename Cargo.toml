[workspace]
members = [
  "colorthief",
  "colorthief-dataset",
  "xtask",
]
default-members = [
  "colorthief",
  "colorthief-dataset",
]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/findit-ai/colorthief"
homepage = "https://github.com/findit-ai/colorthief"

[workspace.dependencies]
thiserror = { version = "2", default-features = false }

colorthief-dataset = { version = "0.2.0", path = "colorthief-dataset", default-features = false }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
# `colorthief_force_scalar` and `colorthief_disable_avx2` are coverage-side
# tier-forcing flags consumed by `colorthief-dataset/src/nearest/mod.rs`
# (mirrors colconv's `--cfg colconv_force_scalar` etc.). Coverage workflows
# pass them via `RUSTFLAGS` to exercise each branch of the SIMD dispatch
# cascade — see `.github/workflows/coverage.yml`.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
  'cfg(colorthief_force_scalar)',
  'cfg(colorthief_disable_avx2)',
  'cfg(colorthief_disable_avx512)',
] }