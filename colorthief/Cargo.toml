[package]
name = "colorthief"
version = "0.1.0"
edition = "2024"
description = "Dominant-color extraction (MMCQ) and human-vocabulary naming for packed-RGB video keyframes — CIEDE2000 (default, scalar), CIE94 (opt-in, SIMD-dispatched), or Delta E 76 (opt-in, SIMD-dispatched) nearest-neighbor against the xkcd hierarchy."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version = "1.95.0"

[dependencies]
# Both deps inherit `default-features = false` from the workspace
# (see workspace Cargo.toml). We re-enable specific features below
# via this crate's [features] section so the no_std/no_alloc story
# stays explicit at every level.
colorthief-dataset = { workspace = true }
thiserror          = { workspace = true }

[features]
# Default = std + alloc + LUT — the convenience tier. Disable
# default-features for embedded / wasm-no-std targets.
default = ["std", "lut"]

# `std` enables `thread_local!`-cached MMCQ storage (zero-alloc-per-
# call across many calls on the same thread). Implies `alloc`.
std = ["alloc", "colorthief-dataset/std", "thiserror/std"]

# `alloc` enables the heap-allocator-backed convenience surface:
# `extract`/`extract_with` returning `Vec<Dominant>`, `Mmcq::new_boxed()`,
# and the `impl Buffer<T> for Vec<T>`. Without `std`, MMCQ allocates
# a fresh `Box<Mmcq>` per call (no caching). For zero-alloc-per-call
# in single-threaded `no_std + alloc` environments (typical
# wasm32-unknown-unknown / interrupt-free bare metal), users should
# place an `Mmcq` in `static mut` themselves and call
# `Mmcq::extract` directly — the `unsafe` then lives at their call
# site instead of being silently smuggled in by a feature flag.
alloc = []

# Pre-computed 32³ candidate-set LUT for CIEDE2000 (the default
# `Algorithm`). Trades ~256-500 KB of static binary for ~2400× faster
# CIEDE2000 lookups (71.5 µs → ~30 ns). Disable via
# `default-features = false` on size-sensitive targets.
lut = ["colorthief-dataset/lut"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "extract"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
