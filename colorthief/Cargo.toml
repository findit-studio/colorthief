[package]
name = "colorthief"
version = "0.0.0"
edition = "2024"
description = "Dominant-color extraction (MMCQ) and human-vocabulary naming for packed-RGB video keyframes — CIEDE2000 (default, scalar), CIE94 (opt-in, SIMD-dispatched), or Delta E 76 (opt-in, SIMD-dispatched) nearest-neighbor against the xkcd hierarchy."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version = "1.95.0"

[dependencies]
# Workspace dep already declares `default-features = false`, so we
# explicitly enable `std` (always required by colorthief itself).
# The `lut` feature flows through the [features] section below.
colorthief-dataset = { workspace = true, features = ["std"] }
thiserror          = { workspace = true, features = ["default"] }

[features]
default = ["lut"]
# Pre-computed 32³ candidate-set LUT for CIEDE2000 (the default
# `Algorithm`). Trades ~256-500 KB of static binary for ~2400× faster
# CIEDE2000 lookups (71.5 µs → ~30 ns). Disable via
# `default-features = false` on size-sensitive targets.
lut = ["colorthief-dataset/lut"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "extract"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
