[package]
name = "colorthief"
version = "0.0.0"
edition = "2024"
description = "Dominant-color extraction (MMCQ) and human-vocabulary naming for packed-RGB video keyframes — Delta E 76 (default, SIMD-dispatched) or CIEDE2000 (opt-in, scalar) nearest-neighbor against the xkcd hierarchy."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version = "1.95.0"

[dependencies]
colorthief-dataset = { workspace = true }
thiserror          = { workspace = true, features = ["default"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "extract"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
