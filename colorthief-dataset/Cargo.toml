[package]
name = "colorthief-dataset"
version = "0.2.0"
# Pinned to edition 2024 to match the workspace; the crate is `no_std`
# (and no_alloc) so this is a pure language-version choice.
edition = "2024"
description = "Static xkcd color-hierarchy table with pre-computed LAB used by `colorthief` for human-vocabulary color naming."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["xkcd", "color", "naming", "no-std", "no-alloc"]
categories = ["data-structures", "algorithms", "no-std", "no-std::no-alloc"]
rust-version = "1.95.0"

[features]
default = ["std", "lut"]
# Forward-compat hook — `colorthief-dataset` does not allocate today, but
# downstream consumers can already opt into the `alloc` feature so that
# adding alloc-using helpers later is a non-breaking change.
alloc = []
std = []
# 32³ candidate-set lookup table for CIEDE2000. Pre-computed at xtask
# codegen time: each LUT cell stores the small set of palette indices
# that are CIEDE2000-nearest at *some* RGB inside the cell's 8×8×8
# bounding box. Runtime: O(1) cell lookup → exact scan over a handful
# of candidates ≈ 30 ns/query. Provably exact at u8 RGB resolution
# (every reachable u8 RGB is sampled at codegen time). Trades ~256-
# 500 KB of static binary for ~2400× speedup on `Algorithm::Ciede2000Exact`
# (the default). Disable on size-constrained targets (wasm, embedded)
# via `default-features = false`.
lut = []

[dependencies]
# `core` has no transcendental math (no `powf`, no `cbrtf`); the sRGB→LAB
# pipeline needs both, so `libm` is a hard dependency in every feature
# configuration. Pure Rust, ~10 KB, dependency-free itself.
libm = { version = "0.2", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
# `tests/ids.rs` reads `assets/color_ids.csv` — the permanent-id ledger —
# and checks it against the shipped table. It must accept everything the
# xtask writer can emit, including names that need quoting, so it reads
# with the same CSV dialect rather than a hand-rolled splitter.
csv = "1"
# Property-based tests live in `tests/properties.rs`; we only need the
# minimum runtime surface (`std`), no fork/timeout/bit-set extras.
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "nearest"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
